<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노래 순서 투표</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1b19;--mu:#78716c;--ac:#e0562b;--bd:#e7e2dc;--bar:#f3d9cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#221f1c;--tx:#f3efea;--mu:#a39b92;--ac:#ff7a4d;--bd:#38332e;--bar:#4a2a1e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171513;--card:#221f1c;--tx:#f3efea;--mu:#a39b92;--ac:#ff7a4d;--bd:#38332e;--bar:#4a2a1e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden}
.n{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;z-index:1}
.t{flex:1;min-width:0;z-index:1}
.t b{display:block;font-size:15px;word-break:keep-all}
.t small{color:var(--mu);font-size:12px}
.mv{display:flex;flex-direction:column;gap:4px;z-index:1}
.mv button{width:36px;height:28px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font-size:14px}
.mv button:disabled{opacity:.3}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);opacity:.7}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;margin-top:6px}
.go:disabled{opacity:.5}
.msg{text-align:center;color:var(--mu);font-size:13px;margin-top:10px;min-height:18px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin:-4px 0 12px}
.live i{width:8px;height:8px;border-radius:50%;background:#aaa}
.live.on i{background:#22c55e;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
#f input,#f textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px;margin-top:4px;resize:vertical}
.cm{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.cm b{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
h2{font-size:16px;margin:20px 0 8px}
.pts{font-weight:700;font-size:14px;color:var(--ac);z-index:1}
</style>
</head>
<body>
<main>
<h1>🎤 노래 순서 투표</h1>
<p class="sub">내가 원하는 순서로 정렬해서 제출하세요. 모두의 투표를 합산해 최종 순서가 정해져요.</p>
<div class="tabs"><button id="tv" class="on">내 투표</button><button id="tr"><span id="lk">🔒</span> 결과 <span id="cnt"></span></button></div>
<div class="live"><i></i><span id="lv">실시간 연결 중…</span></div>
<div id="v"></div>
<div id="f"><input id="nm" maxlength="20" placeholder="닉네임 (선택)"><textarea id="cm" maxlength="300" rows="3" placeholder="코멘트를 남겨주세요 (선택) — 예: 첫 곡은 신나는 곡으로!"></textarea><button class="go" id="sub">투표 제출</button></div>
<div id="r" hidden></div>
<div class="msg" id="msg"></div>
</main>
<script>
var SONGS=[
{t:"서울",a:"쏜애플",g:"남보컬"},
{t:"항복",a:"윤마치",g:"여보컬"},
{t:"LETTER",a:"유다빈 밴드",g:"여보컬"},
{t:"big void",a:"실리카겔",g:"여보컬",n:"첫코드 E > 키업 A 시작"},
{t:"주지마",a:"로꼬, 화사",g:"듀엣"},
{t:"너의 기사",a:"데이먼스 이어",g:"남보컬"},
{t:"ピースサイン (peace sign)",a:"米津玄師 (Yonezu Kenshi)",g:"남보컬"},
{t:"Champagne Supernova",a:"Oasis",g:"남보컬"}
];
var N=SONGS.length,order=SONGS.map(function(_,i){return i}),votes=[],db=null,myId=null,submitted=false,tab="v";
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function row(i,pos,extra){var s=SONGS[i];return '<b>'+esc(s.t)+'</b><small>'+esc(s.a)+' · '+s.g+(s.n?' · '+esc(s.n):'')+'</small>'}
function renderV(){
  $("v").innerHTML=order.map(function(i,p){
    return '<div class="item"><div class="n">'+(p+1)+'</div><div class="t">'+row(i)+'</div><div class="mv"><button data-u="'+p+'"'+(p==0?' disabled':'')+'>▲</button><button data-d="'+p+'"'+(p==N-1?' disabled':'')+'>▼</button></div></div>';
  }).join("");
}
$("v").onclick=function(e){
  var u=e.target.getAttribute("data-u"),d=e.target.getAttribute("data-d"),p;
  if(u!==null){p=+u;order.splice(p-1,0,order.splice(p,1)[0])}
  else if(d!==null){p=+d;order.splice(p+1,0,order.splice(p,1)[0])}
  else return;
  renderV();
};
function renderR(){
  var sc=SONGS.map(function(){return 0});
  votes.forEach(function(v){(v.order||[]).forEach(function(i,p){if(sc[i]!==undefined)sc[i]+=N-p})});
  var max=Math.max.apply(null,sc.concat([1]));
  var idx=SONGS.map(function(_,i){return i}).sort(function(a,b){return sc[b]-sc[a]||a-b});
  $("cnt").textContent="("+votes.length+"명)";
  $("r").innerHTML=votes.length?idx.map(function(i,p){
    return '<div class="item"><div class="fill" style="width:'+(sc[i]/max*100)+'%"></div><div class="n">'+(p+1)+'</div><div class="t">'+row(i)+'</div><div class="pts">'+sc[i]+'점</div></div>';
  }).join("")+'<div class="msg">1위='+N+'점 … '+N+'위=1점 방식으로 합산</div>'+cmts():'<div class="msg">아직 투표가 없어요</div>';
}
function show(t){tab=t;$("v").hidden=t!="v";$("f").hidden=t!="v";$("r").hidden=t!="r";$("tv").className=t=="v"?"on":"";$("tr").className=t=="r"?"on":""}
$("tv").onclick=function(){show("v")};$("tr").onclick=function(){if(!submitted){$("msg").textContent="🔒 투표를 제출하면 결과를 볼 수 있어요.";return}show("r")};
function sync(){$("lk").hidden=submitted;$("sub").textContent=submitted?'투표 수정하기':'투표 제출'}
function cmts(){
  var c=votes.filter(function(v){return v.comment&&v.comment.trim()}).sort(function(a,b){return (b.t||0)-(a.t||0)});
  if(!c.length)return '';
  return '<h2>💬 코멘트 ('+c.length+')</h2>'+c.map(function(v){return '<div class="cm"><b>'+esc(v.name&&v.name.trim()||'익명')+'</b>'+esc(v.comment)+'</div>'}).join('');
}
async function submit(){
  if(!db||!myId){$("msg").textContent="로그인 상태에서만 투표할 수 있어요.";return}
  $("sub").disabled=true;
  try{
    await db.doc("votes/"+myId).set({order:order.slice(),name:$("nm").value.trim().slice(0,20),comment:$("cm").value.trim().slice(0,300),t:Date.now()});
    submitted=true;sync();$("msg").textContent="✅ 투표 완료! 결과는 실시간으로 업데이트돼요.";show("r");
  }catch(e){$("msg").textContent="제출 실패: 권한이 없거나 오류가 발생했어요."}
  $("sub").disabled=false;renderV();
}
renderV();renderR();sync();$("sub").onclick=submit;
(async function(){
  try{
    db=await claude.use("db");var user=await claude.use("user");
    if(!db||!user){$("msg").textContent="투표하려면 로그인이 필요해요.";return}
    myId=await user.id();
    db.collection("votes").onSnapshot(function(snap){
      var arr=[];
      (snap.docs||snap).forEach(function(d){var x=typeof d.data=="function"?d.data():d;if(x&&x.order)arr.push(x);
        var did=d.id;if(did===myId&&x&&x.order&&!submitted){order=x.order.slice();for(var k=0;k<N;k++)if(order.indexOf(k)<0)order.push(k);$("nm").value=x.name||"";$("cm").value=x.comment||"";submitted=true;sync();renderV();show("r")}});
      votes=arr;renderR();
      $("lv").textContent="실시간 · 현재 "+arr.length+"명 투표";$("lv").parentNode.className="live on";
    },function(){$("lv").textContent="실시간 연결 끊김"});
  }catch(e){$("msg").textContent="투표 서버에 연결하지 못했어요."}
})();
</script>
</body>
</html>
